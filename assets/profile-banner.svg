<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Xiang Liu GitHub profile banner</title>
  <desc id="desc">A dark technical banner for efficient LLM inference, long-context evaluation, KV cache compression, and agent workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.52" stop-color="#12273A"/>
      <stop offset="1" stop-color="#173D3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="310" x2="1070" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="0.5" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#D9F99D" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path d="M80 276 C230 198 310 320 462 225 C586 147 681 184 790 116 C925 31 1016 58 1120 106" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M80 298 C229 245 357 270 487 205 C625 136 712 169 832 104 C950 40 1035 61 1120 84" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <g opacity="0.9">
    <circle cx="462" cy="225" r="7" fill="#A7F3D0"/>
    <circle cx="790" cy="116" r="7" fill="#FCD34D"/>
    <circle cx="1016" cy="58" r="7" fill="#7DD3FC"/>
    <circle cx="230" cy="198" r="6" fill="#7DD3FC"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="78" y="70" width="610" height="170" rx="22" fill="#0F172A" fill-opacity="0.72" stroke="#BAE6FD" stroke-opacity="0.2"/>
    <text x="116" y="126" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="760" letter-spacing="0">Xiang Liu</text>
    <text x="118" y="168" fill="#BAE6FD" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="500">Efficient LLM Inference / Agent Systems</text>
    <text x="118" y="207" fill="#D1FAE5" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="500">long-context eval · KV cache · tool use · benchmarks</text>
  </g>

  <g transform="translate(760 72)">
    <rect width="330" height="210" rx="22" fill="#020617" fill-opacity="0.54" stroke="#A7F3D0" stroke-opacity="0.22"/>
    <text x="26" y="48" fill="#A7F3D0" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700">research loop</text>
    <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="15" fill="#E2E8F0">
      <text x="30" y="88">benchmark  →  method</text>
      <text x="30" y="122">artifact   →  critique</text>
      <text x="30" y="156">agent eval →  systems</text>
    </g>
    <rect x="26" y="176" width="88" height="10" rx="5" fill="#7DD3FC"/>
    <rect x="124" y="176" width="68" height="10" rx="5" fill="#A7F3D0"/>
    <rect x="202" y="176" width="96" height="10" rx="5" fill="#FCD34D"/>
  </g>
</svg>
